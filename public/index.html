<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>OZ 내면 명상 타로</title>
<link rel="stylesheet" href="/css/style.css"/>
<link rel="manifest" href="/manifest.json"/>
<meta name="theme-color" content="#c17148"/>
<link rel="icon" href="/icons/icon-192.png"/>
<link rel="apple-touch-icon" href="/icons/icon-192.png"/>
<style>
  .home-wrap { display: flex; flex-direction: column; min-height: calc(100dvh - 84px); }
  .home-main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px; gap: 20px; text-align: center; }
  .home-title { font-size: 24px; line-height: 1.4; }
  .home-sub { font-size: 13.5px; color: var(--muted-foreground); line-height: 1.7; }
  .home-input-bar { border-top: 0.8px solid var(--border); background: rgba(255,255,255,.6); padding: 16px; position: sticky; bottom: 84px; }
  .input-row { display: flex; align-items: flex-end; gap: 10px; background: var(--card); border: 0.8px solid var(--border); border-radius: 20px; padding: 10px 10px 10px 16px; max-width: 560px; margin: 0 auto; }
  .input-row textarea { flex: 1; resize: none; border: none; background: transparent; font-family: inherit; font-size: 14px; line-height: 1.5; max-height: 100px; outline: none; }
  .send-btn { flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%; border: none; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .send-btn:disabled { background: var(--muted); color: var(--muted-foreground); }
  .footer-credit { text-align: center; padding: 6px 0 4px; font-size: 10px; color: rgba(140,128,114,.5); }
  .footer-credit a { color: rgba(140,128,114,.7); }
  .coin-pill { font-weight: 600; color: var(--primary-dark); }
  .price-note { font-size: 12px; color: var(--muted-foreground); text-align: center; margin: 8px auto 0; max-width: 560px; }
</style>
</head>
<body>

<div class="topbar">
  <a href="/index.html" class="brand">OZ <span>✦</span> 내면 명상 타로</a>
  <div class="topbar-actions">
    <a href="/coins.html" class="icon-btn coin-pill" id="coinBadge">🪙</a>
    <a href="/settings.html" class="icon-btn">계정</a>
  </div>
</div>

<div class="home-wrap">
  <div class="home-main" id="moodView">
    <div>
      <h1 class="home-title">오늘 어떤 감정을<br/>느끼고 계신가요?</h1>
      <p class="home-sub mt-8">마음을 나눠주시면 카드가 말을 건넵니다<br/>카드를 뽑는 건 무료, 풀이를 여는 데 <strong>코인 1개</strong>가 들어가요</p>
    </div>
    <div class="chip-grid" id="emotionChips"></div>
  </div>

  <div class="home-input-bar" id="inputBar">
    <div class="input-row">
      <textarea id="emotionInput" rows="1" maxlength="500" placeholder="지금 느끼는 감정을 편하게 적어보세요..."></textarea>
      <button class="send-btn" id="drawBtn" disabled>↑</button>
    </div>
    <p class="price-note" id="priceNote"></p>
  </div>
  <p class="footer-credit">© 주식회사 오즈마(ozma) · 문의 <a href="mailto:ozmaj@naver.com">ozmaj@naver.com</a></p>
</div>

<script type="module">
import { getSb, getSession, getMember, renderBottomNav, claimFreeCoins, renderCoinBadge, getPrice, showToast } from '/js/app.js';

renderBottomNav('/index.html');

const EMOTION_EXAMPLES = [
  { emoji: '😔', text: '오늘 많이 지쳐있어요' },
  { emoji: '💫', text: '설레지만 두렵기도 해요' },
  { emoji: '🌙', text: '혼자인 것 같아 외로워요' },
  { emoji: '🌫️', text: '앞길이 막막하게 느껴져요' },
  { emoji: '🫧', text: '누군가가 그리워요' },
  { emoji: '🌿', text: '작은 것에도 감사함을 느껴요' },
  { emoji: '🫀', text: '불안하고 초조한 마음이에요' },
  { emoji: '🌱', text: '변화가 필요한 것 같아요' },
];

const chipGrid = document.getElementById('emotionChips');
const input = document.getElementById('emotionInput');
const drawBtn = document.getElementById('drawBtn');

chipGrid.innerHTML = EMOTION_EXAMPLES.map(ex => `<button type="button" class="chip" data-text="${ex.text}">${ex.emoji} ${ex.text}</button>`).join('');
chipGrid.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    input.value = chip.dataset.text;
    input.dispatchEvent(new Event('input'));
    input.focus();
  });
});

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 100) + 'px';
  drawBtn.disabled = !input.value.trim();
});

// 카드 뽑기는 무료다. 카드 목록(이름·그림)은 공개 데이터라 브라우저에서 바로 읽고,
// 풀이를 열 때(reading.html)만 로그인과 코인을 확인한다.
let cardsPromise = null;
function loadCards() {
  if (!cardsPromise) {
    cardsPromise = (async () => {
      const sb = await getSb();
      const { data, error } = await sb
        .from('tarot_cards')
        .select('id')
        .eq('card_type', '오쇼젠');
      if (error || !data || !data.length) { cardsPromise = null; throw error || new Error('no cards'); }
      return data;
    })();
  }
  return cardsPromise;
}
loadCards().catch(() => {});

async function draw() {
  const emotion = input.value.trim();
  if (!emotion) return;
  drawBtn.disabled = true;
  try {
    const cards = await loadCards();
    const card = cards[Math.floor(Math.random() * cards.length)];
    sessionStorage.setItem('__pending_reading', JSON.stringify({ emotion, cardId: card.id }));
    window.location.href = '/reading.html';
  } catch (err) {
    console.error(err);
    showToast('카드를 불러오지 못했어요. 잠시 후 다시 시도해주세요.');
    drawBtn.disabled = !input.value.trim();
  }
}

drawBtn.addEventListener('click', draw);
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    draw();
  }
});

(async () => {
  const session = await getSession();
  if (session) {
    await getMember(session);
    await claimFreeCoins(session);
  }
  await renderCoinBadge(document.getElementById('coinBadge'));
  try {
    const price = await getPrice('reading');
    document.getElementById('priceNote').textContent = `풀이 1회 🪙 ${price}코인 · 풀이는 기록에 저장돼요`;
  } catch {}
})();
</script>
</body>
</html>
