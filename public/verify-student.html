<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>OZ 내면 명상 타로 · 수강생 인증</title>
<link rel="stylesheet" href="/css/style.css"/>
<link rel="manifest" href="/manifest.json"/>
<meta name="theme-color" content="#bc6338"/>
<link rel="icon" href="/icons/icon-192.png"/>
<link rel="apple-touch-icon" href="/icons/icon-192.png"/>
<style>
  .auth-wrap { max-width: 380px; margin: 0 auto; padding: 60px 24px 40px; }
  .auth-title { text-align: center; font-size: 21px; margin-bottom: 6px; }
  .auth-sub { text-align: center; color: var(--muted-foreground); font-size: 12.5px; margin-bottom: 30px; }
  .err { color: var(--danger); font-size: 12.5px; margin-top: -8px; margin-bottom: 14px; display: none; }
  .ok { color: var(--accent-foreground); font-size: 13px; margin-top: -8px; margin-bottom: 14px; display: none; }
  .done-box { text-align: center; padding: 22px 16px; background: var(--secondary); border-radius: 14px; font-size: 13.5px; line-height: 1.7; }
  #code { text-transform: uppercase; letter-spacing: 1px; }
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="center" style="font-size:30px;margin-bottom:8px;">🎓</div>
  <div class="auth-title">정규 수강생 인증</div>
  <div class="auth-sub">강의에서 안내받은 인증 코드를 입력하시면<br/>정규 수강생으로 등록되고 코인이 지급돼요</div>

  <div id="doneBox" class="done-box" style="display:none;">
    🎓 이미 정규 수강생으로 인증되어 있어요.<br/>코인은 보유 코인 화면에서 확인하실 수 있어요.
    <div style="margin-top:16px;"><a href="/index.html" class="btn btn-primary btn-block">앱으로 돌아가기</a></div>
  </div>

  <form id="verifyForm">
    <div class="field">
      <label>인증 코드</label>
      <input type="text" id="code" required autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="예: OZMA-2026-A"/>
    </div>
    <p class="err" id="errMsg"></p>
    <p class="ok" id="okMsg"></p>
    <button type="submit" class="btn btn-primary btn-block" id="submitBtn">인증하기</button>
  </form>

  <p class="small muted center mt-24">코드를 받지 못하셨다면 강사님께 문의해주세요.</p>
  <p class="small muted center mt-16"><a href="/auth.html">← 로그인으로 돌아가기</a></p>
</div>

<script type="module">
import { getSb, getSession, getMember, ensureMemberRow, APP_KEY } from '/js/app.js';

const form = document.getElementById('verifyForm');
const errMsg = document.getElementById('errMsg');
const okMsg = document.getElementById('okMsg');
const submitBtn = document.getElementById('submitBtn');
const doneBox = document.getElementById('doneBox');

const MESSAGES = {
  invalid: '유효하지 않은 코드입니다. 코드를 다시 확인해주세요.',
  expired: '사용 기간이 지난 코드입니다. 강사님께 문의해주세요.',
  full: '이 코드는 사용 가능 인원이 모두 찼어요. 강사님께 문의해주세요.',
};

function showError(text) {
  errMsg.style.display = 'block';
  errMsg.textContent = text;
}

getSession().then(async (s) => {
  if (!s) return;
  const member = await getMember(s);
  if (member && member.role === 'student') {
    form.style.display = 'none';
    doneBox.style.display = 'block';
  }
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errMsg.style.display = 'none';
  okMsg.style.display = 'none';

  const session = await getSession();
  if (!session) {
    showError('먼저 로그인 또는 회원가입을 해주세요.');
    setTimeout(() => window.location.href = '/auth.html', 1200);
    return;
  }
  await ensureMemberRow(session);

  const code = document.getElementById('code').value.trim().toUpperCase();
  if (!code) return;
  submitBtn.disabled = true;
  submitBtn.textContent = '확인 중...';

  const sb = await getSb();
  const { data, error } = await sb.rpc('redeem_class_code', { p_code: code, p_app_key: APP_KEY });

  if (error) {
    console.error('redeem_class_code failed', error);
    showError('인증 중 오류가 발생했어요. 잠시 후 다시 시도해주세요.');
  } else if (data === 'not_logged_in') {
    showError('로그인이 필요해요.');
    setTimeout(() => window.location.href = '/auth.html', 1200);
  } else if (data !== 'ok') {
    showError(MESSAGES[data] || MESSAGES.invalid);
  } else {
    okMsg.style.display = 'block';
    okMsg.textContent = '인증 완료! 수강생 코인이 지급되었어요 🪙';
    submitBtn.textContent = '완료';
    setTimeout(() => window.location.href = '/index.html', 1200);
    return;
  }

  submitBtn.disabled = false;
  submitBtn.textContent = '인증하기';
});
</script>
</body>
</html>
