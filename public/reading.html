<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>OZ 내면 명상 타로 · 리딩</title>
<link rel="stylesheet" href="/css/style.css"/>
<link rel="manifest" href="/manifest.json"/>
<meta name="theme-color" content="#c17148"/>
<link rel="icon" href="/icons/icon-192.png"/>
<link rel="apple-touch-icon" href="/icons/icon-192.png"/>
<style>
  .r-header { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px; }
  .r-header a { font-size: 13px; color: var(--muted-foreground); display: flex; align-items: center; gap: 4px; }
  .r-actions { display: flex; gap: 8px; }
  .card-name-block { text-align: center; margin-top: 14px; }
  .card-name-block .ko { font-family: 'Noto Serif KR', serif; font-size: 17px; }
  .card-name-block .en { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted-foreground); margin-top: 2px; }
  .new-draw-cta { text-align: center; padding-top: 20px; }
  .pay-gate { text-align: center; padding: 26px 20px; margin-top: 22px; background: var(--secondary); border-radius: 16px; }
  .pay-gate .ic { font-size: 28px; margin-bottom: 8px; }
  .pay-gate h2 { font-size: 16px; }
  .pay-gate p { font-size: 13px; line-height: 1.7; color: var(--muted-foreground); margin-top: 8px; }
  .saved-note { text-align: center; font-size: 12px; color: var(--muted-foreground); margin-top: 18px; }
</style>
</head>
<body>

<div class="r-header">
  <a href="/index.html">← 돌아가기</a>
  <div class="r-actions">
    <button class="icon-btn" id="shareBtn" style="display:none;">공유</button>
    <a href="/coins.html" class="icon-btn" id="coinBadge" style="font-weight:600;color:var(--primary-dark);">🪙</a>
  </div>
</div>

<div class="container" style="padding-top:8px;">
  <div id="resultView" style="display:none;">
    <div class="tarot-card lg" id="tarotCard">
      <div class="tarot-card-inner">
        <div class="tarot-card-face tarot-card-back"><div class="medallion"></div></div>
        <div class="tarot-card-face tarot-card-front">
          <div class="tc-top"><span id="tcArcana"></span><span id="tcNum"></span></div>
          <div class="tc-art"><img id="tcImg" src="" alt=""/></div>
          <div class="tc-name"><div class="ko" id="tcNameKo"></div></div>
        </div>
      </div>
    </div>
    <div class="card-name-block">
      <div class="ko" id="cardNameKo2"></div>
      <div class="en" id="cardTopLabel2"></div>
    </div>

    <div class="reading-emotion">
      <p>당신의 마음</p>
      <div class="txt" id="emotionText"></div>
    </div>

    <div id="openGate" class="pay-gate">
      <div class="ic">🔮</div>
      <h2>이 카드의 이야기를 열어볼까요?</h2>
      <p>풀이를 열 때 코인 1개가 사용돼요.<br/>열어본 풀이는 기록에 저장돼서 언제든 다시 볼 수 있어요.</p>
      <button class="btn btn-primary mt-16" id="openBtn">🪙 풀이 열기 (코인 1개)</button>
    </div>

    <div id="readingLoading" class="center" style="padding: 30px 20px; display:none;">
      <div class="spinner"></div>
      <p class="muted small mt-16">카드의 이야기를 읽고 있어요...</p>
    </div>

    <div id="payGate" class="pay-gate" style="display:none;">
      <div class="ic" id="gateIc">🔒</div>
      <h2 id="gateTitle"></h2>
      <p id="gateDesc"></p>
      <a href="#" class="btn btn-primary mt-16" id="gateBtn"></a>
      <p class="small muted mt-16" id="gateRetryNote" style="display:none;">코인은 차감되지 않았어요.</p>
      <button class="btn btn-outline mt-16" id="gateRetryBtn" style="display:none;">다시 시도하기</button>
    </div>

    <div id="summaryBlock" class="reading-summary" style="display:none;"></div>
    <div id="sectionsBlock"></div>
    <p class="saved-note" id="savedNote" style="display:none;">풀이는 <a href="/history.html" style="color:var(--primary-dark);font-weight:600;">기록</a>에 저장됐어요.</p>

    <div class="new-draw-cta">
      <a href="/index.html" class="btn btn-primary">새 카드 뽑기</a>
    </div>
  </div>

  <div id="errorView" style="display:none;" class="empty-state">
    <div class="ic">🔮</div>
    <p>카드를 불러오지 못했어요.</p>
    <a href="/index.html" class="btn btn-primary mt-16">홈으로</a>
  </div>
</div>

<script type="module">
import { getSb, getSession, showToast, claimFreeCoins, renderCoinBadge, gateMessage } from '/js/app.js';

const raw = sessionStorage.getItem('__pending_reading');
const resultView = document.getElementById('resultView');
const errorView = document.getElementById('errorView');
const readingLoading = document.getElementById('readingLoading');
const payGate = document.getElementById('payGate');

let currentCard = null;
let currentEmotion = '';
let currentCardId = null;
let currentInterpretation = '';

function showError() {
  resultView.style.display = 'none';
  errorView.style.display = 'block';
}

function renderCard(card) {
  document.getElementById('tcArcana').textContent = card.arcana === 'Major' ? 'MAJOR' : 'MINOR';
  document.getElementById('tcNum').textContent = String(card.cardNum).padStart(2, '0');
  document.getElementById('tcImg').src = card.imageUrl || '';
  document.getElementById('tcImg').alt = card.name;
  document.getElementById('tcNameKo').textContent = card.name;
  document.getElementById('cardNameKo2').textContent = card.name;
  document.getElementById('cardTopLabel2').textContent = card.topLabel || '';
}

// 카드 이름이 "{무늬} {숫자} · {키워드}" 꼴인지에 따라 메이저/마이너를 가린다 (서버와 같은 규칙).
function isMajor(num) { return num <= 23; }
function topLabel(name, num) {
  if (isMajor(num)) return '메이저 아르카나';
  const [suitRank] = String(name).split(' · ');
  return `마이너 아르카나 · ${suitRank || ''}`;
}

async function loadCard(id) {
  const sb = await getSb();
  const { data, error } = await sb
    .from('tarot_cards')
    .select('id, card_num, name, keyword, image_url')
    .eq('id', id)
    .maybeSingle();
  if (error || !data) throw error || new Error('card not found');
  return {
    id: data.id, cardNum: data.card_num, name: data.name, keyword: data.keyword,
    arcana: isMajor(data.card_num) ? 'Major' : 'Minor',
    topLabel: topLabel(data.name, data.card_num), imageUrl: data.image_url,
  };
}

function renderInterpretation(text) {
  const parts = text.split(/\n\n+/);
  const summary = (parts[0] || '').trim();
  const rest = parts.slice(1).join('\n\n').trim();

  const summaryBlock = document.getElementById('summaryBlock');
  if (summary) {
    summaryBlock.style.display = 'block';
    summaryBlock.textContent = summary;
  }

  const sections = [];
  let currentHeader = null;
  let lines = [];
  for (const line of rest.split('\n')) {
    if (line.startsWith('◇ ')) {
      if (lines.join('').trim() || currentHeader !== null) sections.push({ header: currentHeader, body: lines.join('\n').trim() });
      currentHeader = line.slice(2).trim();
      lines = [];
    } else {
      lines.push(line);
    }
  }
  if (lines.join('').trim() || currentHeader !== null) sections.push({ header: currentHeader, body: lines.join('\n').trim() });

  const sectionsBlock = document.getElementById('sectionsBlock');
  sectionsBlock.innerHTML = '';
  if (sections.length) {
    const divider = document.createElement('div');
    divider.className = 'reading-divider';
    divider.textContent = '카드의 이야기';
    sectionsBlock.appendChild(divider);
  }
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  sections.forEach(s => {
    const el = document.createElement('div');
    el.className = 'reading-section';
    el.innerHTML = (s.header ? `<div class="rs-header">${esc(s.header)}</div>` : '') +
      `<div class="rs-body${s.header ? '' : ' center serif'}">${esc(s.body)}</div>`;
    sectionsBlock.appendChild(el);
  });
}

function showGate(status) {
  readingLoading.style.display = 'none';
  const g = gateMessage(status);
  document.getElementById('gateIc').textContent = status === 401 ? '🔒' : '🪙';
  document.getElementById('gateTitle').textContent = g.title;
  document.getElementById('gateDesc').textContent = g.desc;
  const btn = document.getElementById('gateBtn');
  btn.textContent = g.btn;
  btn.href = g.href;
  btn.style.display = '';
  document.getElementById('gateRetryNote').style.display = 'none';
  document.getElementById('gateRetryBtn').style.display = 'none';
  payGate.style.display = 'block';
}

function showRetry(message) {
  readingLoading.style.display = 'none';
  document.getElementById('gateIc').textContent = '🌙';
  document.getElementById('gateTitle').textContent = message;
  document.getElementById('gateDesc').textContent = '';
  document.getElementById('gateBtn').style.display = 'none';
  document.getElementById('gateRetryNote').style.display = 'block';
  const retry = document.getElementById('gateRetryBtn');
  retry.style.display = 'inline-flex';
  retry.onclick = () => loadReading();
  payGate.style.display = 'block';
}

async function loadReading() {
  document.getElementById('openGate').style.display = 'none';
  payGate.style.display = 'none';
  readingLoading.style.display = 'block';

  const session = await getSession();
  if (!session) { showGate(401); return; }
  try {
    const res = await fetch('/api/reading', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access_token },
      body: JSON.stringify({ emotion: currentEmotion, cardId: currentCardId }),
    });
    if (res.status === 401 || res.status === 402) { showGate(res.status); return; }
    if (res.status === 429) {
      const { error } = await res.json().catch(() => ({}));
      showRetry(error || '요청이 너무 많아요. 잠시 후 다시 시도해주세요.');
      return;
    }
    if (!res.ok) throw new Error('reading failed');
    const data = await res.json();
    currentInterpretation = data.interpretation;
    sessionStorage.removeItem('__pending_reading');

    readingLoading.style.display = 'none';
    renderInterpretation(data.interpretation);
    document.getElementById('shareBtn').style.display = '';
    document.getElementById('savedNote').style.display = 'block';
    await renderCoinBadge(document.getElementById('coinBadge'));
    showToast(`🪙 코인 ${data.cost}개를 썼어요 · 기록에 저장됐어요`, 3200);
  } catch (err) {
    console.error(err);
    showRetry('지금은 풀이를 불러오지 못했어요.');
  }
}

async function run() {
  if (!raw) { window.location.href = '/index.html'; return; }
  let parsed;
  try { parsed = JSON.parse(raw); } catch { window.location.href = '/index.html'; return; }
  currentEmotion = String(parsed.emotion || '');
  currentCardId = Number.isInteger(parsed.cardId) ? parsed.cardId : null;
  if (!currentEmotion || currentCardId == null) { window.location.href = '/index.html'; return; }
  document.getElementById('emotionText').textContent = `"${currentEmotion}"`;

  const session = await getSession();
  if (session) await claimFreeCoins(session);
  await renderCoinBadge(document.getElementById('coinBadge'));

  try {
    currentCard = await loadCard(currentCardId);
  } catch (err) {
    console.error(err);
    showError();
    return;
  }
  resultView.style.display = 'block';
  renderCard(currentCard);
  requestAnimationFrame(() => document.getElementById('tarotCard').classList.add('flipped'));

  // 카드는 무료로 보여주고, 풀이는 버튼을 눌렀을 때만 코인을 쓴다.
  const openBtn = document.getElementById('openBtn');
  openBtn.addEventListener('click', () => { openBtn.disabled = true; loadReading(); });
}

document.getElementById('shareBtn').addEventListener('click', async () => {
  if (!currentCard || !currentInterpretation) return;
  const title = `내면 명상 타로 — ${currentCard.name}`;
  const text = `${currentCard.name}\n"${currentEmotion}"\n\n${currentInterpretation}`;
  if (navigator.share) {
    try { await navigator.share({ title, text }); return; } catch {}
  }
  try {
    await navigator.clipboard.writeText(text);
    showToast('클립보드에 복사했어요.');
  } catch {
    showToast('공유에 실패했어요.');
  }
});

run();
</script>
</body>
</html>
